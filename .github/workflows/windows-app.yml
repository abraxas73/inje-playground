name: Windows app
on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: Run updater transport probe without packaging
        type: boolean
        default: false
  # push 트리거 제거(2026-10-23): 가리키던 abraxas73/mobile 브랜치는 2026-10-11 이후 쓰지 않고,
  # 윈도 러너 자동 빌드는 비용이 커서 릴리스 절차대로 수동 실행(workflow_dispatch)만 남긴다.
  # 정적 분석·테스트는 ci.yml이 리눅스 러너에서 맡는다.
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build updater transport probe
        shell: pwsh
        run: |
          cmake -S mobile/windows/tests -B mobile/build/updater-tests -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Updater probe configure failed' }
          cmake --build mobile/build/updater-tests --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Updater probe build failed' }
          ctest --test-dir mobile/build/updater-tests -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Updater policy tests failed' }
      - name: Verify updater redirect credentials
        shell: pwsh
        run: node mobile/scripts/test-windows-update-redirect.mjs mobile/build/updater-tests/Release/winsparkle_redirect_probe.exe
      - uses: subosito/flutter-action@v2
        if: ${{ !inputs.probe_only }}
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @('mobile/scripts/build-windows.ps1', 'mobile/scripts/verify-windows-signatures.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Install packaging tools
        shell: pwsh
        run: choco install innosetup nuget.commandline -y --no-progress
      - name: Verify unattended installer lifecycle
        shell: pwsh
        run: ./mobile/scripts/test-windows-update-installer.ps1
      - name: Verify actual signed updater lifecycle
        shell: pwsh
        run: node mobile/scripts/test-windows-signed-upgrade.mjs
      - name: Verify redirected feed credential isolation
        shell: pwsh
        run: node mobile/scripts/test-windows-feed-credential-chain.mjs
      - name: Build installer
        if: ${{ !inputs.probe_only }}
        shell: pwsh
        run: ./mobile/scripts/build-windows.ps1
      - name: Sign final update artifact
        if: ${{ !inputs.probe_only }}
        shell: pwsh
        env:
          INNOCREW_UPDATE_PRIVATE_KEY: ${{ secrets.INNOCREW_WINDOWS_UPDATE_PRIVATE_KEY }}
        run: ./mobile/scripts/build-windows.ps1 -Phase Sign
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.probe_only }}
        with:
          name: INNOGRID-Windows
          path: mobile/build/windows/distribution/*
          if-no-files-found: error
          retention-days: 30
