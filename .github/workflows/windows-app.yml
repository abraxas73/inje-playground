name: Windows app
on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: Run updater transport probe without packaging
        type: boolean
        default: false
      sign:
        description: Authenticode-sign payload and installer with the short-lived AZURE_SIGNING_TOKEN secret (docs/windows-signing.md)
        type: boolean
        default: false
  # push 트리거 제거(2026-10-23): 가리키던 abraxas73/mobile 브랜치는 2026-10-11 이후 쓰지 않고,
  # 윈도 러너 자동 빌드는 비용이 커서 릴리스 절차대로 수동 실행(workflow_dispatch)만 남긴다.
  # 정적 분석·테스트는 ci.yml이 리눅스 러너에서 맡는다.
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build updater transport probe
        shell: pwsh
        run: |
          cmake -S mobile/windows/tests -B mobile/build/updater-tests -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Updater probe configure failed' }
          cmake --build mobile/build/updater-tests --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Updater probe build failed' }
          ctest --test-dir mobile/build/updater-tests -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Updater policy tests failed' }
      - name: Verify updater redirect credentials
        shell: pwsh
        run: node mobile/scripts/test-windows-update-redirect.mjs mobile/build/updater-tests/Release/winsparkle_redirect_probe.exe
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: ${{ !inputs.probe_only }}
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @('mobile/scripts/build-windows.ps1', 'mobile/scripts/verify-windows-signatures.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Install packaging tools
        shell: pwsh
        run: choco install innosetup nuget.commandline -y --no-progress
      - name: Verify unattended installer lifecycle
        shell: pwsh
        run: ./mobile/scripts/test-windows-update-installer.ps1
      - name: Verify actual signed updater lifecycle
        shell: pwsh
        run: node mobile/scripts/test-windows-signed-upgrade.mjs
      - name: Verify redirected feed credential isolation
        shell: pwsh
        run: node mobile/scripts/test-windows-feed-credential-chain.mjs
      - name: Build installer
        if: ${{ !inputs.probe_only && !inputs.sign }}
        shell: pwsh
        run: ./mobile/scripts/build-windows.ps1
      # 임시 서명 경로(2026-11-19 사용자 결정 B): 운영자 Mac의 az login 접근 토큰(약 1시간)을 비밀값으로 잠깐 넣고 실행, 끝나면 비밀값 삭제.
      # Ed25519 업데이트 서명은 반드시 Authenticode 뒤(아래 Sign final update artifact).
      - name: Build application (unsigned, no secrets)
        if: ${{ !inputs.probe_only && inputs.sign }}
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') { throw 'Signing runs only from main' }
          ./mobile/scripts/build-windows.ps1 -Phase Build
          Set-Location $env:GITHUB_WORKSPACE  # build-windows.ps1이 mobile/로 이동해 둔다
          $jar = Join-Path $env:RUNNER_TEMP 'jsign-7.6.jar'
          Invoke-WebRequest https://repo1.maven.org/maven2/net/jsign/jsign/7.6/jsign-7.6.jar -OutFile $jar
          if ((Get-FileHash $jar -Algorithm SHA256).Hash -ne '6CF58AA080E7FF82656F320CFF8D4A3BFF30408DF8766806DCBA3740DD839FA5') { throw 'jsign hash mismatch' }
          $payload = @(Get-ChildItem mobile/build/windows/x64/runner/Release -Recurse -File | Where-Object { ($_.Extension -in @('.exe', '.dll')) -and (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -eq 'NotSigned' } | ForEach-Object FullName)
          if (-not $payload.Count) { throw 'No unsigned payload files found' }
          $payload | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'signing-files.txt')
      - name: Sign payload (token only here)
        if: ${{ !inputs.probe_only && inputs.sign }}
        shell: pwsh
        env:
          AZ_TOKEN: ${{ secrets.AZURE_SIGNING_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZ_TOKEN)) { throw 'AZURE_SIGNING_TOKEN secret is missing' }
          $files = @(Get-Content (Join-Path $env:RUNNER_TEMP 'signing-files.txt'))
          & (Join-Path $env:JAVA_HOME_17_X64 'bin/java.exe') -jar (Join-Path $env:RUNNER_TEMP 'jsign-7.6.jar') --storetype TRUSTEDSIGNING --keystore krc.codesigning.azure.net --storepass $env:AZ_TOKEN --alias innogrid/innogrid-public --tsaurl http://timestamp.acs.microsoft.com --tsmode RFC3161 --alg SHA-256 @files
          if ($LASTEXITCODE -ne 0) { throw 'Payload signing failed' }
      # Inno Setup이 컴파일하면서 직접 서명(SignTool): 바깥 설치 파일 + 임시 폴더 설치 엔진 사본 + 제거 프로그램.
      # 토큰은 sign.cmd가 환경 변수에서 읽어 ISCC 로그의 명령 줄에 남지 않는다.
      - name: Package and sign installer (token only here)
        if: ${{ !inputs.probe_only && inputs.sign }}
        shell: pwsh
        env:
          AZ_TOKEN: ${{ secrets.AZURE_SIGNING_TOKEN }}
          WINDOWS_SIGNING_SUBJECT: 'CN=(주) 이노그리드, O=(주) 이노그리드, L=서울특별시 중구, S=Seoul, C=KR'
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZ_TOKEN)) { throw 'AZURE_SIGNING_TOKEN secret is missing' }
          $cmd = Join-Path $env:RUNNER_TEMP 'sign.cmd'
          $java = Join-Path $env:JAVA_HOME_17_X64 'bin\java.exe'
          $jar = Join-Path $env:RUNNER_TEMP 'jsign-7.6.jar'
          "@`"$java`" -jar `"$jar`" --storetype TRUSTEDSIGNING --keystore krc.codesigning.azure.net --storepass %AZ_TOKEN% --alias innogrid/innogrid-public --tsaurl http://timestamp.acs.microsoft.com --tsmode RFC3161 --alg SHA-256 %1" | Set-Content -Encoding ascii $cmd
          $env:INNO_SIGN_CMD = "`"$cmd`" `$f"
          ./mobile/scripts/build-windows.ps1 -Phase Package -RequireSignedPayload
      - name: Verify installer signature and hash signed bytes
        if: ${{ !inputs.probe_only && inputs.sign }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_SUBJECT: 'CN=(주) 이노그리드, O=(주) 이노그리드, L=서울특별시 중구, S=Seoul, C=KR'
        run: |
          $installer = @(Get-ChildItem mobile/build/windows/distribution/*.exe)
          ./mobile/scripts/verify-windows-signatures.ps1 -Path mobile/build/windows/distribution -PrimaryFile $installer[0].Name
          $hash = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer[0].Name)" | Set-Content -Encoding ascii "$($installer[0].FullName).sha256"
      - name: Sign final update artifact
        if: ${{ !inputs.probe_only }}
        shell: pwsh
        env:
          INNOCREW_UPDATE_PRIVATE_KEY: ${{ secrets.INNOCREW_WINDOWS_UPDATE_PRIVATE_KEY }}
        run: ./mobile/scripts/build-windows.ps1 -Phase Sign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !inputs.probe_only }}
        with:
          name: INNOGRID-Windows
          path: mobile/build/windows/distribution/*
          if-no-files-found: error
          retention-days: 30
