name: Windows app
on:
  workflow_dispatch:
  push:
    branches: [abraxas73/mobile]
    paths: ['mobile/**', '.github/workflows/windows-app.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($file in @('mobile/scripts/build-windows.ps1', 'mobile/scripts/verify-windows-signatures.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Install packaging tools
        shell: pwsh
        run: choco install innosetup nuget.commandline -y --no-progress
      - name: Build installer
        shell: pwsh
        run: ./mobile/scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: INNOGRID-Windows
          path: mobile/build/windows/distribution/*
          if-no-files-found: error
          retention-days: 30
