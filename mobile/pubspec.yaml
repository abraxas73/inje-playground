name: playground
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.3+6

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.6
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# 앱 아이콘 — 이노그리드 CI 가이드(Background Color #006cdb + 흰 CONNECTION 모티프). 원본은 assets/brand/app_icon*.png(런북 §배포에 재생성 방법). 바뀌면 `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/brand/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#006cdb"
  adaptive_icon_foreground: assets/brand/app_icon_fg.png
